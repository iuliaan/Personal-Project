name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore ProjectLogixtiXX.slnx

      - run: dotnet build ProjectLogixtiXX.slnx --no-restore -c Release

      - run: dotnet test ProjectLogixtiXX.slnx --no-build -c Release